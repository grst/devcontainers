name: test

# Builds the images and exercises them against test/python/, which is a fixture
# consumer repo. The interesting cases are the negative ones: a gate that stops
# refusing, or an isolation check that stops noticing, fails silently in a way that
# only shows up when it matters.
#
# Runs on docker rather than podman: GitHub runners have docker, and nothing being
# tested here is podman-specific. The podman-only parts (up.sh, --userns=keep-id)
# are exercised by hand on the host -- see the README.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    # A throwaway registry to hand the base image to the python build.
    #
    # buildx's docker-container driver runs in its own container and cannot see the
    # docker daemon's local image store, so a `load: true` base tagged dc-base:test is
    # invisible to the next build -- it resolves FROM ${BASE_REF} as
    # docker.io/library/dc-base:test and fails with "pull access denied". Pushing to a
    # localhost registry is the supported way to chain two buildx builds. The builder
    # needs network=host to reach it, and BuildKit allows plain HTTP for localhost.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      # The container user is vscode, uid 1000; the runner checks out as uid 1001. The
      # workspace bind would be mounted rw but unwritable, so `uv sync` fails on
      # creating .venv. On the host this is handled by podman's --userns=keep-id, which
      # docker has no equivalent for, so hand the fixture over explicitly.
      - name: Give the fixture to uid 1000
        run: sudo chown -R 1000:1000 test/python

      - name: Build base
        uses: docker/build-push-action@v6
        with:
          context: base
          push: true
          tags: localhost:5000/dc-base:test
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      # load: true here, because the smoke steps below run it with `docker run`, which
      # does read the daemon's image store.
      - name: Build python
        uses: docker/build-push-action@v6
        with:
          context: python
          load: true
          build-args: BASE_REF=localhost:5000/dc-base:test
          tags: dc-python:test
          cache-from: type=gha,scope=python
          cache-to: type=gha,scope=python,mode=max

      # --- Image-level checks, no dev container involved -------------------
      # NET_ADMIN is granted so the firewall can actually apply; the smoke script
      # runs the gate's negative cases itself.
      - name: Smoke test (firewall off)
        run: |
          docker run --rm \
            --cap-add=NET_ADMIN --cap-add=NET_RAW \
            -e DEVCONTAINER_FIREWALL=off \
            -v "${PWD}/test/python:/workspace" \
            dc-python:test \
            bash -c 'sudo -E /usr/local/bin/devcontainer-firewall && bash smoke.sh'

      - name: Smoke test (firewall on)
        run: |
          docker run --rm \
            --cap-add=NET_ADMIN --cap-add=NET_RAW \
            -e DEVCONTAINER_FIREWALL=on \
            -v "${PWD}/test/python:/workspace" \
            dc-python:test \
            bash -c 'sudo -E /usr/local/bin/devcontainer-isolation && sudo -E /usr/local/bin/devcontainer-firewall && bash smoke.sh'

      # The firewall must configure ip6tables too, not only iptables. An IPv4-only
      # ruleset looks perfectly correct under `iptables -S` while leaving every
      # dual-stack destination reachable over v6, which is a hole this repo shipped
      # once. Assert the v6 chain is actually locked down, independently of whether
      # this particular runner has global IPv6 to test against.
      #
      # The ICMPv6 pattern is `ipv6-icmp`, not the `icmpv6` the script passes in:
      # ip6tables accepts both spellings as input but canonicalises to the former when
      # dumping with -S. Grepping for what was written finds nothing.
      - name: Firewall locks down IPv6 as well as IPv4
        run: |
          out=$(docker run --rm --cap-add=NET_ADMIN --cap-add=NET_RAW \
            -e DEVCONTAINER_FIREWALL=on dc-python:test \
            bash -c 'sudo -E /usr/local/bin/devcontainer-firewall >/dev/null 2>&1;
                     echo "v4=$(sudo iptables -S OUTPUT | grep -c "^-P OUTPUT DROP")";
                     echo "v6=$(sudo ip6tables -S OUTPUT | grep -c "^-P OUTPUT DROP")";
                     echo "v6set=$(sudo ip6tables -S OUTPUT | grep -c "match-set devcontainer-allow6")";
                     echo "icmpv6=$(sudo ip6tables -S OUTPUT | grep -c "p ipv6-icmp -j ACCEPT")"')
          echo "$out"
          for k in v4 v6 v6set icmpv6; do
            grep -q "^${k}=1$" <<<"$out" || { echo "::error::${k} check failed"; exit 1; }
          done
          echo 'ok: both families default-DROP, v6 allowlist and ICMPv6 present'

      # --- The gate must fail the container, not just complain -------------
      - name: Firewall gate refuses an unset choice
        run: |
          if docker run --rm dc-python:test \
              sudo -E /usr/local/bin/devcontainer-firewall; then
            echo '::error::the firewall gate accepted an unset DEVCONTAINER_FIREWALL'
            exit 1
          fi
          echo 'ok: unset DEVCONTAINER_FIREWALL fails the container'

      - name: Firewall refuses firewall=on without NET_ADMIN
        run: |
          if docker run --rm -e DEVCONTAINER_FIREWALL=on dc-python:test \
              sudo -E /usr/local/bin/devcontainer-firewall; then
            echo '::error::firewall=on succeeded without NET_ADMIN; it cannot have applied any rules'
            exit 1
          fi
          echo 'ok: firewall=on without NET_ADMIN fails the container'

      # --- The isolation check must notice the things it exists for --------
      - name: Isolation check rejects a writable extra mount
        run: |
          if docker run --rm \
              -e DEVCONTAINER_FIREWALL=off \
              -v "${PWD}/test/python:/workspace" \
              -v "${PWD}/test:/mnt/host-escape" \
              dc-python:test sudo -E /usr/local/bin/devcontainer-isolation; then
            echo '::error::a writable extra bind mount was accepted'
            exit 1
          fi
          echo 'ok: unexpected writable mount fails the container'

      - name: Isolation check accepts an allowlisted read-only mount
        run: |
          docker run --rm \
            -e DEVCONTAINER_FIREWALL=off \
            -e DEVCONTAINER_EXTRA_MOUNTS=/mnt/models:ro \
            -v "${PWD}/test/python:/workspace" \
            -v "${PWD}/test:/mnt/models:ro" \
            dc-python:test sudo -E /usr/local/bin/devcontainer-isolation
          echo 'ok: a declared read-only mount is accepted'

      - name: Isolation check rejects a declared mount that is writable
        run: |
          if docker run --rm \
              -e DEVCONTAINER_FIREWALL=off \
              -e DEVCONTAINER_EXTRA_MOUNTS=/mnt/models:ro \
              -v "${PWD}/test/python:/workspace" \
              -v "${PWD}/test:/mnt/models" \
              dc-python:test sudo -E /usr/local/bin/devcontainer-isolation; then
            echo '::error::a mount declared ro was accepted while mounted rw'
            exit 1
          fi
          echo 'ok: ro-declared-but-rw-mounted fails the container'

      - name: Isolation check rejects a forwarded ssh agent
        run: |
          if docker run --rm \
              -e DEVCONTAINER_FIREWALL=off \
              -e SSH_AUTH_SOCK=/tmp/agent.sock \
              -v "${PWD}/test/python:/workspace" \
              dc-python:test sudo -E /usr/local/bin/devcontainer-isolation; then
            echo '::error::a forwarded SSH agent was accepted'
            exit 1
          fi
          echo 'ok: SSH_AUTH_SOCK fails the container'

      - name: Isolation check rejects a mounted container runtime socket
        run: |
          if docker run --rm \
              -e DEVCONTAINER_FIREWALL=off \
              -v "${PWD}/test/python:/workspace" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              dc-python:test sudo -E /usr/local/bin/devcontainer-isolation; then
            echo '::error::a mounted docker socket was accepted -- that is a container escape'
            exit 1
          fi
          echo 'ok: a mounted runtime socket fails the container'

  # Template sources, validated on every PR. This used to live in the publish workflow,
  # which only ran on tags -- so a broken template was found at release time, or by a
  # consumer, rather than in the pull request that broke it.
  templates:
    runs-on: ubuntu-latest

    # Publishing for real, to a throwaway registry, is the only way a pull request can
    # cover the publish path: on the real registry it happens only after merge.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm install -g @devcontainers/cli

      # `devcontainer templates apply` copies these into a consumer repo with the mode
      # they have here. A missing exec bit on host-secrets.sh silently disabled secret
      # fetching in every applied repo -- up.sh's `[ -x ]` guard made it a no-op with
      # no error -- so the mode is now part of the contract rather than an accident.
      - name: Template scripts are executable
        run: |
          rc=0 n=0
          while read -r mode _ _ path; do
            n=$((n + 1))
            case "$mode" in
              100755) ;;
              *) echo "::error::${path} is mode ${mode}; must be 100755"; rc=1 ;;
            esac
          done < <(git ls-files -s 'src/*/.devcontainer/*.sh')
          # An empty match would otherwise pass, which is the same shape of silent
          # success this check exists to catch.
          [ "$n" -gt 0 ] || { echo '::error::no template scripts matched'; rc=1; }
          echo "checked ${n} template scripts"
          exit "$rc"

      # Catch a malformed devcontainer-template.json or an option that no longer matches
      # what devcontainer.json references. `version` is deliberately not checked: the
      # publish workflow overwrites it from the ref, so whatever is in the file is a
      # placeholder.
      - name: Validate the template sources
        run: |
          for dir in src/*/; do
            id="$(basename "$dir")"
            echo "== ${id}"
            jq -e --arg id "$id" '.id == $id' "${dir}devcontainer-template.json" >/dev/null \
              || { echo "::error::${dir}devcontainer-template.json id must equal '${id}'"; exit 1; }

            # Every ${templateOption:x} used in the template must be declared, and every
            # declared option should be used -- an undeclared one is substituted with
            # nothing and silently produces a broken config.
            declared="$(jq -r '.options | keys[]' "${dir}devcontainer-template.json" | sort)"
            used="$(grep -rhoE '\$\{templateOption:[A-Za-z0-9_]+\}' "$dir" \
                     | sed -E 's/.*:([A-Za-z0-9_]+)\}/\1/' | sort -u)"
            if [ -n "$(comm -13 <(echo "$declared") <(echo "$used"))" ]; then
              echo "::error::${id}: undeclared options used: $(comm -13 <(echo "$declared") <(echo "$used") | tr '\n' ' ')"
              exit 1
            fi
            if [ -n "$(comm -23 <(echo "$declared") <(echo "$used"))" ]; then
              echo "::warning::${id}: declared but unused options: $(comm -23 <(echo "$declared") <(echo "$used") | tr '\n' ' ')"
            fi

            # The firewall option must have no default. That is the whole point of layer 1
            # of the gate, and it is the kind of thing a well-meaning edit would "fix" by
            # adding one.
            if jq -e '.options.firewall | has("default")' "${dir}devcontainer-template.json" >/dev/null; then
              echo "::error::${id}: options.firewall must NOT have a default; the choice is mandatory"
              exit 1
            fi
          done

      # Everything below exercises the path that otherwise only runs after a merge:
      # stamp the version, publish, and apply the result the way a consumer does.
      # The version published here is passed to the apply step below as an explicit tag.
      # Not `latest`: the CLI only moves that onto the greatest version published, so a
      # main build does not reliably get it, and a test that applied `:latest` would
      # either fail or silently exercise some older artifact.
      - name: Publish the templates to the throwaway registry
        id: publish
        env:
          REF_TYPE: branch
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/stamp-templates.sh
          devcontainer templates publish --registry localhost:5000 --namespace dct ./src \
            | tee publish-summary.json
          jq -e 'to_entries | length > 0' publish-summary.json >/dev/null
          echo "version=$(jq -r '.python.version' publish-summary.json)" >> "$GITHUB_OUTPUT"

      - name: A consumer can apply it
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          git init -q .
          devcontainer templates apply --workspace-folder . \
            -t localhost:5000/dct/python:${{ steps.publish.outputs.version }} \
            -a '{"firewall":"on"}'

          for f in devcontainer.json up.sh host-secrets.sh post-create.sh; do
            [ -f ".devcontainer/${f}" ] || { echo "::error::${f} missing after apply"; exit 1; }
          done

          # `templates apply` preserves the mode the file was published with, and an exec
          # bit lost on host-secrets.sh silently disabled secret fetching in every applied
          # repo. Assert it on the consumer side, where it is what actually matters.
          for f in up.sh host-secrets.sh post-create.sh; do
            [ -x ".devcontainer/${f}" ] || { echo "::error::.devcontainer/${f} is not executable after apply"; exit 1; }
          done

          if grep -rn '\${templateOption:' .devcontainer/; then
            echo '::error::an unsubstituted templateOption survived apply'
            exit 1
          fi
          grep -q '"DEVCONTAINER_FIREWALL": "on"' .devcontainer/devcontainer.json \
            || { echo '::error::firewall=on did not reach containerEnv'; exit 1; }
          echo 'ok: applied template is complete, substituted and executable'

      # Pins what the CLI really does with a mandatory option, which is weaker than it
      # looks: with -a omitted it does NOT refuse, it substitutes an empty string and
      # exits 0. Enforcement is therefore layer 2 -- devcontainer-firewall rejecting an
      # empty value, which the smoke job asserts. If the CLI ever starts filling in a
      # value here, layer 2 would quietly stop being what enforces the choice.
      - name: Omitting the firewall option leaves it empty rather than defaulted
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer-noopt"
          cd "$RUNNER_TEMP/consumer-noopt"
          git init -q .
          devcontainer templates apply --workspace-folder . \
            -t localhost:5000/dct/python:${{ steps.publish.outputs.version }}
          grep -q '"DEVCONTAINER_FIREWALL": ""' .devcontainer/devcontainer.json \
            || { echo '::error::expected an empty DEVCONTAINER_FIREWALL; CLI behaviour changed'; exit 1; }
          echo 'ok: unset option lands empty, and the runtime gate rejects that'

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning \
            .github/scripts/stamp-templates.sh \
            base/bin/devcontainer-firewall \
            base/bin/devcontainer-isolation \
            base/bin/statusline.sh \
            src/python/.devcontainer/post-create.sh \
            src/python/.devcontainer/up.sh \
            src/python/.devcontainer/host-secrets.sh \
            test/python/smoke.sh

  zsh-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: zsh -n on the dotfiles
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          for f in base/dotfiles/zshrc base/dotfiles/*.zsh; do
            echo "== $f"
            zsh -n "$f"
          done
