name: images

# Builds and publishes the two images. python is built FROM base in the same run,
# so a base change never leaves the two out of step in the registry.
#
#   ghcr.io/grst/devcontainers/base
#   ghcr.io/grst/devcontainers/python
#
# Note these are deliberately a different namespace from the Template artifacts
# (ghcr.io/grst/devcontainer-templates/*), which would otherwise collide: a template
# with id `python` published from this repo lands at ghcr.io/grst/devcontainers/python.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - base/**
      - python/**
      - .github/workflows/images.yaml
  pull_request:
    paths:
      - base/**
      - python/**
      - .github/workflows/images.yaml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # amd64 only for now. arm64 works (both pinned binaries have aarch64 assets and
  # the Node tarball has arm64), but QEMU emulation makes `uv python install`
  # painfully slow, so add it as a matrix entry when there is a reason to.
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Pushes only from main and tags. A pull request builds to verify the
      # Dockerfiles still work but must not publish.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata for base
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/devcontainers/base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Deterministic, full-SHA tag. type=sha above is the short form, which
            # is nicer to read but not something the python build can compute.
            type=raw,value=ci-${{ github.sha }}

      - name: Build and push base
        id: base
        uses: docker/build-push-action@v6
        with:
          context: base
          file: base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          # Loaded locally on a PR so the python build below can still use it.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Metadata for python
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/devcontainers/python
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Pin the child to the exact base built above rather than to :latest, so this
      # run is self-consistent even if another run publishes a new base meanwhile.
      # On push that is the immutable digest; on a pull request the base was only
      # loaded locally, so use the deterministic ci- tag instead.
      - name: Resolve the base reference
        id: base-ref
        env:
          BASE_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/devcontainers/base
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          if [ -n "${BASE_DIGEST}" ]; then
            echo "ref=${BASE_IMAGE}@${BASE_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${BASE_IMAGE}:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push python
        uses: docker/build-push-action@v6
        with:
          context: python
          file: python/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            BASE_REF=${{ steps.base-ref.outputs.ref }}
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha,scope=python
          cache-to: type=gha,scope=python,mode=max
