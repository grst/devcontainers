name: publish

# Builds and publishes everything a consumer repo pulls, in one run from one commit:
#
#   ghcr.io/grst/devcontainers/base              image
#   ghcr.io/grst/devcontainers/python            image, built FROM base in this run
#   ghcr.io/grst/devcontainer-templates/python   Template artifact
#
# One workflow rather than two on different triggers, because the template's
# devcontainer.json is what points at the image: publishing them separately is what let
# them drift. A single job also gives ordering for free -- the images exist before the
# template that references them.
#
# The two namespaces are deliberately different. A template with id `python` published
# from this repo would otherwise land at ghcr.io/grst/devcontainers/python, exactly
# where the python *image* lives, which is why the CLI is used with an explicit
# --namespace instead of devcontainers/action.

# Publishing only -- no pull_request trigger. A PR build would have to hand the
# freshly built base to the python build without a registry to put it in, and buildx's
# docker-container driver cannot read the docker daemon's image store. test.yaml
# already builds both images and validates the template sources on every PR, so PR
# coverage is not lost by leaving it out here.
#
# No `paths:` filter. Every merge to main publishes, so "whatever is on main is on the
# registry" holds without having to reason about which paths a change touched -- and a
# doc-only merge is cheap, since the image layers come from the gha cache. The cost of a
# filter is a main commit whose dev tag does not exist, which is exactly the kind of
# thing you only discover while trying to use it.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # amd64 only for now. arm64 works (both pinned binaries have aarch64 assets and
  # the Node tarball has arm64), but QEMU emulation makes `uv python install`
  # painfully slow, so add it as a matrix entry when there is a reason to.
  PLATFORMS: linux/amd64

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Pushes only from main and tags. A pull request builds to verify the
      # Dockerfiles still work but must not publish.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata for base
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/devcontainers/base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push base
        id: base
        uses: docker/build-push-action@v6
        with:
          context: base
          file: base/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Metadata for python
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/devcontainers/python
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # Pinned to the immutable digest of the base just pushed, not to :latest, so this
      # run stays self-consistent even if another run publishes a new base meanwhile.
      - name: Build and push python
        uses: docker/build-push-action@v6
        with:
          context: python
          file: python/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            BASE_REF=${{ env.REGISTRY }}/${{ github.repository_owner }}/devcontainers/base@${{ steps.base.outputs.digest }}
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha,scope=python
          cache-to: type=gha,scope=python,mode=max

      # -------------------------------------------------------------------
      # Template artifacts
      # -------------------------------------------------------------------
      # The version comes from the ref, never from a constant in the repo. The CLI
      # derives the published tags from `version` in devcontainer-template.json and
      # always pushes major / major.minor / version / latest, so a hardcoded 1.0.0
      # republished tag `1` on every release no matter what was being released.
      # Measured tag sets:
      #
      #   version 0.1.0            -> 0, 0.1, 0.1.0, latest
      #   version 0.0.0-main.abc12 -> 0, 0.0, 0.0.0-main.abc12, latest
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - run: npm install -g @devcontainers/cli

      # The same script test.yaml dry-runs against a throwaway registry on every pull
      # request, so this step cannot break in a way a PR would not have caught.
      - name: Stamp the template version from the ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/stamp-templates.sh

      - name: Publish templates
        env:
          # The CLI authenticates to ghcr from the docker config written by
          # docker/login-action above; GITHUB_TOKEN covers the path where it asks for a
          # token itself.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          devcontainer templates publish \
            --registry ghcr.io \
            --namespace "${{ github.repository_owner }}/devcontainer-templates" \
            ./src
