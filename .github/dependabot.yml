version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # Keeps the FROM lines current. The pinned tool versions inside the Dockerfiles
  # (YQ_VERSION, RGA_VERSION, NODE_VERSION, UV_VERSION) are plain ARGs that
  # dependabot does not track -- `grep -rn '^ARG .*VERSION' base python` lists all
  # of them for a manual bump.
  - package-ecosystem: docker
    directories:
      - /base
      - /python
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
