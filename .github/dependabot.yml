version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7

  # Keeps the FROM line current. The pinned tool versions in the Dockerfile
  # (YQ_VERSION, RGA_VERSION, NODE_VERSION, UV_VERSION) are plain ARGs that
  # dependabot does not track -- `grep -n '^ARG .*VERSION' python/Dockerfile`
  # lists all of them for a manual bump.
  - package-ecosystem: docker
    directory: /python
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
